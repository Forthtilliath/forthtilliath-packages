name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter react-sb exec playwright install --with-deps chromium

      - run: pnpm run format:check

      - run: pnpm run lint

      - run: pnpm run check-types

      - run: pnpm run build

      # Also enforces the coverage thresholds: CI=true turns coverage on in the
      # vitest configs, so tests run once instead of again under `coverage`.
      - run: pnpm run test

      - run: pnpm run size

      # Not part of `build` (turbo only runs each package's `build` script):
      # without this step, a broken story or Storybook config would only
      # surface on the next local `storybook build`.
      - name: Build Storybook
        run: pnpm --filter react-sb run build-storybook

      # apps/shadweb/registry is generated from forth-ui's sources: fail if a
      # forth-ui change was committed without regenerating it.
      - name: Check the shadweb registry is up to date
        run: |
          pnpm --filter shadweb run registry:generate
          git diff --exit-code -- apps/shadweb/registry apps/shadweb/registry.json
