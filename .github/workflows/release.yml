name: Release

on:
  push:
    branches: [main]
  # Kept as a manual safety net (e.g. to re-run a failed release) now that the
  # "Version Packages" commit no longer carries "[skip ci]" (see the `commit`
  # override below) and reliably retriggers this workflow on its own.
  workflow_dispatch: {}

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run build

      - name: Create release PR or publish to npm
        uses: changesets/action@v1
        with:
          # changesets/action's own default commit message carries "[skip ci]",
          # which makes GitHub skip every workflow run for that commit — including
          # the "ci" check required by branch protection, permanently blocking the
          # "Version Packages" PR, and the Release workflow's own push trigger once
          # that commit becomes the tip of main after merging. Overriding it here
          # with a plain message keeps both working without manual intervention.
          commit: "chore: release packages"
          publish: pnpm run publish-packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
