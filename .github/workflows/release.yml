name: Release

on:
  push:
    branches: [main]
  # Kept as a manual safety net (e.g. to re-run a failed release) now that the
  # "Version Packages" commit no longer carries "[skip ci]" (see the `commit`
  # override below) and reliably retriggers this workflow on its own.
  workflow_dispatch: {}

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # `npm stage publish` (see scripts/publish.mjs) needs npm >= 11.15, newer
      # than the npm bundled with Node 22.
      - run: npm install -g npm@11

      # No separate build step: the "version" path doesn't need one, and
      # publish-packages already runs `turbo run build lint` before publishing.

      - name: Create release PR or stage the new versions on npm
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          # `changeset version`'s own auto-commit (triggered by "commit": true in
          # .changeset/config.json, now set to false) used to run before this
          # input ever applied, always with a commit message carrying "[skip ci]".
          # GitHub skips every workflow run for that commit — including the "ci"
          # check required by branch protection, permanently blocking the
          # "Version Packages" PR, and this workflow's own push trigger once
          # that commit becomes the tip of main after merging. With config.commit
          # disabled, this override is now the one actually used.
          commit: "chore: release packages"
          publish: pnpm run publish-packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Granular token with "Read and write (stage only)" on @forthtilliath:
          # it can only stage versions, each one goes live after a 2FA approval
          # on npmjs.com (Staged Packages) — a leaked token cannot publish.
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          # npm provenance: each published version is linked to the workflow run
          # and commit that built it (signed through the id-token permission
          # above), shown as a "Provenance" badge on npmjs.com.
          NPM_CONFIG_PROVENANCE: true
