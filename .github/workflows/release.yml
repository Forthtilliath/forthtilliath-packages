name: Release

on:
  push:
    branches: [main]
  # Manual fallback: if a push to main happens to land with "[skip ci]" in its
  # head commit message (e.g. rebase-merging the changesets bot's own
  # "Version Packages" PR replays its commit, [skip ci] included, as the new
  # tip), GitHub skips every workflow for that push and this never fires on
  # its own — dispatch it by hand instead of pushing a throwaway commit.
  workflow_dispatch: {}

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run build

      - name: Create release PR or publish to npm
        uses: changesets/action@v1
        with:
          publish: pnpm run publish-packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
