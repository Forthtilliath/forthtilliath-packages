name: Release

on:
  push:
    branches: [main]
  # Kept as a manual safety net (e.g. to re-run a failed release) now that the
  # "Version Packages" commit no longer carries "[skip ci]" (see the `commit`
  # override below) and reliably retriggers this workflow on its own.
  workflow_dispatch: {}

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run build

      - name: Create release PR or publish to npm
        uses: changesets/action@v1
        with:
          # `changeset version`'s own auto-commit (triggered by "commit": true in
          # .changeset/config.json, now set to false) used to run before this
          # input ever applied, always with a commit message carrying "[skip ci]".
          # GitHub skips every workflow run for that commit — including the "ci"
          # check required by branch protection, permanently blocking the
          # "Version Packages" PR, and this workflow's own push trigger once
          # that commit becomes the tip of main after merging. With config.commit
          # disabled, this override is now the one actually used.
          commit: "chore: release packages"
          publish: pnpm run publish-packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
