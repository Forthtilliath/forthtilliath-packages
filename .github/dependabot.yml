version: 2
updates:
  # Keeps the SHA-pinned actions of .github/workflows up to date: one grouped
  # PR a month, the version tag kept as a comment next to each SHA.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
    ignore:
      # changesets/action v2 only works with @changesets/cli v3: stay on v1
      # until the repo moves to CLI v3 (the v2 bump broke every release).
      - dependency-name: changesets/action
        update-types: ["version-update:semver-major"]
