packages:
  - apps/*
  - packages/*
  - packages/react/*

# Explicit allowlist for dependencies allowed to run install scripts. Newer
# pnpm (11.21.0+ at least) hard-errors on unapproved ignored build scripts
# instead of just warning — without this, `pnpm install` fails outright.
onlyBuiltDependencies:
  - '@tailwindcss/oxide'
  - esbuild
  - lefthook

catalog:
  '@tailwindcss/postcss': 4.1.12
  '@turbo/gen': ^2.10.9
  '@types/node': ^26.2.0
  '@types/react': ^19.2.18
  '@types/react-dom': ^19.2.4
  eslint: 10.7.0
  react: ^19.2.8
  react-dom: ^19.2.8
  tailwindcss: 4.1.12
  typescript: ^5.9.3
